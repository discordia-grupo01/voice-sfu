services:
  signaling:
    build:
      context: ./signaling
      dockerfile: Dockerfile
    ports:
      - "${SIGNALING_PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-clave_de_ejemplo_de_al_menos_64_caracteres_de_largo_para_pruebas_locales}
      JWT_SECRET: ${JWT_SECRET:-clave_de_ejemplo_de_al_menos_64_caracteres_de_largo_para_pruebas_locales}
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://host.docker.internal:7880}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret
      VOICE_AUTHZ_MODE: ${VOICE_AUTHZ_MODE:-allow_authenticated}
      MESSAGING_URL: ${MESSAGING_URL:-http://host.docker.internal:4000}
      RABBITMQ_URL: ${RABBITMQ_URL_DOCKER:-amqp://guest:guest@host.docker.internal:5672/}
      EVENTS_EXCHANGE: discordia.events
      ADMIN_EVENTS_HMAC_SECRET: ${ADMIN_EVENTS_HMAC_SECRET:-secreto-admin-solo-local}
      VOICE_INSTANCE_ID: local-signaling-1
      VOICE_REPLICA_DATABASE_URL: postgres://${DATABASE_USER:-discordia}:${DATABASE_PASSWORD:-discordia}@db:5432/${DATABASE_NAME:-discordia_voice}
      VOICE_EVENTS_DATABASE_URL: postgres://${DATABASE_USER:-discordia}:${DATABASE_PASSWORD:-discordia}@db:5432/${DATABASE_NAME:-discordia_voice}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "51000-51010:51000-51010/udp"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-discordia_voice}
      POSTGRES_USER: ${DATABASE_USER:-discordia}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-discordia}
    ports:
      - "${DATABASE_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DATABASE_USER:-discordia} -d ${DATABASE_NAME:-discordia_voice}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
