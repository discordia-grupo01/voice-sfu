app = "discordia-signaling-staging"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  MIX_ENV = "prod"
  PORT = "4000"
  VOICE_AUTHZ_MODE = "servers_api"
  EVENTS_EXCHANGE = "discordia.events"
  VOICE_EVENTS_QUEUE = "voice.signaling"
  PHOENIX_CHECK_ORIGINS = "https://discordia-g1.vercel.app,http://localhost:3000,http://127.0.0.1:3000"

[[services]]
  protocol = "tcp"
  internal_port = 4000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "15s"
    method = "get"
    path = "/livez"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1