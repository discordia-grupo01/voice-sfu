app = "discordia-signaling-production"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  MIX_ENV = "prod"
  PORT = "4000"
  VOICE_AUTHZ_MODE = "servers_api"
  EVENTS_EXCHANGE = "discordia.events"
  VOICE_EVENTS_QUEUE = "voice.signaling"
  VOICE_INSTANCE_ID = "local-signaling-1"
  PHOENIX_CHECK_ORIGINS = "https://discordia-g1.vercel.app"

[[services]]
  protocol = "tcp"
  internal_port = 4000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "15s"
    method = "get"
    path = "/readyz"