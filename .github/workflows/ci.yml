name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: signaling

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discordia_servicio
          POSTGRES_USER: discordia
          POSTGRES_PASSWORD: discordia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U discordia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.3'
          otp-version: '26'

      - name: Iniciar LiveKit
        run: |
          docker run -d \
            --name livekit \
            --network host \
            -p 7880:7880 \
            livekit/livekit-server:latest \
            --dev

      - name: Instalar dependencias
        run: mix deps.get

      - name: Chequeo de formato
        run: mix format --check-formatted

      - name: Compilar
        run: mix compile --warnings-as-errors

      - name: Ejecutar tests
        run: mix test --cover

  deploy-staging:
    name: Deploy to Staging (Fly.io)
    needs: test
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Desplegar en Staging
        run: flyctl deploy --config signaling/fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-production:
    name: Deploy to Production (Fly.io)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Desplegar en Produccion
        run: flyctl deploy --config signaling/fly.production.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}