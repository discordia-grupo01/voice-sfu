name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: signaling

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discordia_servicio
          POSTGRES_USER: discordia
          POSTGRES_PASSWORD: discordia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U discordia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.3'
          otp-version: '26'
          version-type: strict

      - name: Instalar dependencias
        run: mix deps.get

      - name: Chequeo de formato
        run: mix format --check-formatted

      - name: Compilar
        run: mix compile --warnings-as-errors

      - name: Ejecutar tests
        run: mix test --cover